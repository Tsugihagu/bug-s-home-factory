<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="styling" href="web-css.css">
    <script src="Functionilaity.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug's spotify factory</title>
</head>
<body>

<sidebar>
    <div class="menuitem" id="no-wifi">Non-internett music player</div>
    <div class="menuitem" id="wifi">internett music player</div>
</sidebar>

<div class="main cointainer">

    <div class="volumebar">
        <input type="range" id="volumeslide" min="0" max="100" value="50"> 
    </div>

    <div class="seciton" id="song-seleciton">
        <h1 class="information">Play your songs</h1>
        <div class="youtube-display">
            <input type="text" id="yt-url" placeholder="Paste url here">
            <button onclick="saveVideo()">save</button>

        </div>
    </div>
    <div class="section" id="display-section">
        <h2>Your songs</h2>
        <div class="container" id="video-container"></div>
        <button id="pause-b">pause/unpause</button>
        <h2>Now Playing</h2>
        
        <img id="thumbnail" width="320">
        <div id="now-title"></div>
        <div id="playsong">
            <div id="yt-player"></div>
        </div>
    </div>
    

    

</div>

    
</body>
</html>
